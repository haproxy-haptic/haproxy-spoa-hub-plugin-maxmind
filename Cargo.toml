[package]
name = "maxmind-plugin"
version = "0.4.0"
edition = "2024"
rust-version = "1.86"
description = "MaxMind GeoIP lookup plugin for haproxy-spoa-hub"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Requires plugin-api 0.6.0+ for the v2 vtable's set_metric_recorder.
# Plugin still loads on v0.5.x hubs (append-only ABI; old hubs read
# only what they know and the install becomes a no-op).
haproxy-spoa-hub-plugin-api = "0.8"
maxminddb = "0.30"
serde = "1"
log = "0.4"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
serde_json = "1"

[[bench]]
name = "lookup_bench"
harness = false

[profile.release]
lto = true
codegen-units = 1
