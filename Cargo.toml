[package]
name = "maxmind-plugin"
version = "0.2.1"
edition = "2024"
rust-version = "1.86"
description = "MaxMind GeoIP lookup plugin for haproxy-spoa-hub"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
haproxy-spoa-hub-plugin-api = "0.2"
abi_stable = "0.11"
maxminddb = "0.28"
serde = "1"
log = "0.4"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
serde_json = "1"

[[bench]]
name = "lookup_bench"
harness = false

[profile.release]
lto = true
codegen-units = 1
