plugin_dir = "/opt/spoa-plugins"
default_timeout_ms = 100
log_level = "info"

[[listeners]]
type = "unix"
address = "/var/run/haproxy-spoa-hub.sock"

# MaxMind GeoIP lookup with City + ASN databases
[[plugins]]
name = "maxmind"
library = "libmaxmind_plugin.so"
messages = ["geoip-lookup"]

[plugins.params]
locale = "en"

[[plugins.params.databases]]
type = "city"
path = "/data/GeoLite2-City.mmdb"

[[plugins.params.databases]]
type = "asn"
path = "/data/GeoLite2-ASN.mmdb"

# Example with additional database types:
#
# [[plugins.params.databases]]
# type = "anonymous"
# path = "/data/GeoIP2-Anonymous-IP.mmdb"
#
# [[plugins.params.databases]]
# type = "isp"
# path = "/data/GeoIP2-ISP.mmdb"
#
# [[plugins.params.databases]]
# type = "conntype"
# path = "/data/GeoIP2-Connection-Type.mmdb"
#
# [[plugins.params.databases]]
# type = "domain"
# path = "/data/GeoIP2-Domain.mmdb"
#
# To restrict output to specific fields:
# fields = ["country_iso_code", "city_name", "autonomous_system_number"]
