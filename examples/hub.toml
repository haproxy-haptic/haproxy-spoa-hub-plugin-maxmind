plugin_dir = "/opt/spoa-plugins"
default_timeout_ms = 100
log_level = "info"

[[listeners]]
type = "unix"
address = "/var/run/haproxy-spoa-hub.sock"

# MaxMind GeoIP lookup with City + ASN databases.
[[plugins]]
name = "maxmind"
library = "libmaxmind_plugin.so"
messages = ["geoip-enrich"]

# Load every MMDB file under an operator-chosen alias. Aliases are referenced
# from the lookups below; pick names that read well in your config.
[plugins.params.databases]
city = { path = "/data/GeoLite2-City.mmdb" }
asn  = { path = "/data/GeoLite2-ASN.mmdb"  }

# Define exactly the extractions you want. Each lookup binds one SPOE message
# to one field path inside one database, producing one transaction variable
# plus a sibling `<output_var>_status` variable carrying ok / not_found / error.
[[plugins.params.lookups]]
name       = "country_code"
message    = "geoip-enrich"
database   = "city"
path       = ["country", "iso_code"]
output_var = "geo_country"

[[plugins.params.lookups]]
name       = "city_name_de"
message    = "geoip-enrich"
database   = "city"
path       = ["city", "names", "de"]
output_var = "geo_city_de"

[[plugins.params.lookups]]
name       = "as_number"
message    = "geoip-enrich"
database   = "asn"
path       = ["autonomous_system_number"]
output_var = "geo_asn"

# Multiple lookups can share a message name — the plugin runs them all in one
# round-trip and returns the union of their output variables. Add as many as
# you need without paying additional HAProxy↔plugin round-trips.
#
# To geolocate the original client behind a forwarding proxy, configure a
# different `input` arg name on the lookup and match it in HAProxy's SPOE
# message definition (e.g. `args client_ip=req.hdr(X-Forwarded-For)`):
#
# [[plugins.params.lookups]]
# name       = "forwarded_country"
# message    = "geoip-forwarded"
# database   = "city"
# input      = "client_ip"
# path       = ["country", "iso_code"]
# output_var = "fwd_country"
